{% extends 'base.html' %}
{% block title %}Agregar Tenis{% endblock %}
{% block content %}

<form method="POST">

  <div class="field">
    <label class="label">Marca</label>
    <input class="input" type="text" name="marca" required>
  </div>

  <div class="field">
    <label class="label">Modelo</label>
    <input class="input" type="text" name="modelo" required>
  </div>

  <div class="field">
    <label class="label">Talla</label>
    <input class="input" type="number" step="0.1" name="talla" required>
  </div>

  <div class="field">
    <label class="label">Color</label>
    <input class="input" type="text" name="color">
  </div>

  <div class="field">
    <label class="label">Precio</label>
    <input class="input" type="number" step="0.01" name="precio">
  </div>

  <div class="field">
    <label class="label">Stock</label>
    <input class="input" type="number" name="stock">
  </div>

  <button type="submit" class="button is-primary">Guardar</button>
  <a href="{{ url_for('index') }}" class="button is-light">Cancelar</a>

</form>

{% endblock %}
